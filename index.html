<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LAMAN 104 POS V3</title>
<style>
:root{--blue:#208fc6;--navy:#171a1c;--bg:#242628;--card:#f5ead8;--line:#48423a;--green:#238b55;--red:#c9473d;--cream:#efe0c8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#39332d 0,#252628 44%,#1d1f20 100%);color:#f4eadc}
button{font:inherit;cursor:pointer}.app{height:100vh;display:grid;grid-template-rows:72px 1fr}
header{background:linear-gradient(90deg,#17191b,#302820);border-bottom:1px solid #4c4034;display:flex;align-items:center;padding:9px 16px;gap:14px}
.brand{font-size:25px;font-weight:950;color:#f0dfc4;line-height:.92;min-width:175px}.brand small{display:block;font-size:9px;letter-spacing:3px;margin-top:7px}
.tabs{display:flex;gap:7px}.tab{border:0;border-radius:11px;padding:11px 15px;font-weight:900;background:#292b2d;color:#c9bba7;border:1px solid #554a40}.tab.active{background:#a43b35;color:#fff;border-color:#b84a43}
.stats{margin-left:auto;display:flex;gap:7px}.stat{background:#2c3032;color:#f1e3cf;border:1px solid #4b4540;border-radius:11px;padding:10px 12px;font-weight:850;white-space:nowrap}.reset{border:1px solid #edc6c6;background:#fff5f5;color:var(--red);padding:10px 11px;border-radius:11px;font-weight:850}
main{display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:0}.menu{padding:13px;overflow:auto;background-image:linear-gradient(#ffffff05 1px,transparent 1px);background-size:100% 36px}.cartpanel{background:#f5ead8;color:#302a25;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 10px}.sectionhead h2{font-size:20px;margin:0;color:#f5e7d3}.pricepill{background:#a43b35;color:#fff;border-radius:999px;padding:7px 11px;font-weight:950}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.card{border:1px solid #d4c2a8;background:var(--card);border-radius:15px;overflow:hidden;text-align:left;box-shadow:0 2px 9px #0000000d;padding:0;min-width:0}
.card:active{transform:scale(.98)}.pic{height:100px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cup{width:55px;height:68px;border-radius:7px 7px 16px 16px;position:relative;box-shadow:0 7px 12px #0003;border:2px solid #ffffffaa}
.cup:before{content:"";position:absolute;left:7px;right:7px;top:-12px;height:22px;border-radius:50%;background:#fff7e8;box-shadow:0 3px 0 #ffffff55}
.cup:after{content:"";position:absolute;width:5px;height:42px;background:#272727;right:7px;top:-28px;border-radius:4px;transform:rotate(7deg)}
.cup span{position:absolute;left:0;right:0;bottom:13px;text-align:center;font-size:22px}
.straw{background:linear-gradient(#ffd8df,#e95e77 70%)}.mango{background:linear-gradient(#fff1b6,#f2b62f 72%)}.chip{background:radial-gradient(circle at 25% 25%,#3b2419 0 3px,transparent 4px),linear-gradient(#e2c0a9,#a97055)}.choc{background:linear-gradient(#c28b6b,#75432f)}.oreo{background:radial-gradient(circle at 35% 35%,#292929 0 4px,transparent 5px),linear-gradient(#eee4dc,#b8a59a)}.capp{background:linear-gradient(#ead3bd,#b97c55)}.hazel{background:radial-gradient(circle at 30% 40%,#65402b 0 3px,transparent 4px),linear-gradient(#e1bd9d,#a56f4c)}.van{background:linear-gradient(#fffdf0,#f1e2b8)}.blue{background:linear-gradient(#eee1ff,#8455b4)}.whitec{background:linear-gradient(#f2ddc7,#c69a73)}
.mixvisual{height:42px;display:flex;align-items:center;gap:8px;margin-bottom:6px}.mini{width:25px;height:34px;border-radius:4px 4px 9px 9px;border:1px solid #fff8;box-shadow:0 3px 5px #0002}
.c1{background:linear-gradient(145deg,#ffdadd,#fff2f3)}.c2{background:linear-gradient(145deg,#ffe5a4,#fff7dc)}.c3{background:linear-gradient(145deg,#d8b39d,#f5e4db)}.c4{background:linear-gradient(145deg,#b9836c,#ead4c8)}.c5{background:linear-gradient(145deg,#d9d4d2,#f5f4f3)}
.c6{background:linear-gradient(145deg,#d9b18d,#f2e1d1)}.c7{background:linear-gradient(145deg,#c9946e,#ead8c7)}.c8{background:linear-gradient(145deg,#fff3d5,#fffdf5)}.c9{background:linear-gradient(145deg,#d9c1f1,#f2e9fa)}.c10{background:linear-gradient(145deg,#dfc4a7,#f5e8dc)}
.ct{padding:8px 10px;color:#302a25}.name{font-weight:900;font-size:14px;line-height:1.1;min-height:31px}.price{color:#a43b35;font-weight:950;font-size:15px;margin-top:3px}
.mixgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mixcard{border:1px solid #c9b697;background:var(--cream);color:#302a25;border-radius:13px;padding:10px;text-align:left;min-height:74px}
.mixcard:active{transform:scale(.98)}.mixname{font-weight:900;font-size:13px;line-height:1.15}.mixprice{margin-top:8px;color:#b52f37;font-weight:950}
.orderhead{background:linear-gradient(90deg,#17191b,#393027);color:#fff;padding:15px 16px;display:flex;justify-content:space-between;align-items:center}.orderhead b{font-size:20px}.orderhead small{opacity:.8}
.cart{flex:1;overflow:auto;padding:7px 16px}.empty{text-align:center;color:#8d7d6b;padding:65px 8px}.line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}.line b{font-size:14px}.desc{font-size:11px;color:#887665;margin-top:3px}.right{text-align:right;font-weight:900}.qtybox{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px}.qtybtn{border:0;background:#ded0bb;color:#302a25;border-radius:7px;width:29px;height:27px;font-weight:950}.qtynum{min-width:22px;text-align:center;font-weight:950}.del{border:0;background:#f5dada;color:#a43b35;border-radius:7px;width:29px;height:27px;font-weight:950}
.checkout{border-top:1px solid #d4c2a8;padding:12px 16px 15px;background:#f0e2ce}.tot{display:flex;justify-content:space-between;align-items:end;font-weight:900}.amount{font-size:29px;color:#a43b35;font-weight:950}.payrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.pay{border:0;border-radius:12px;padding:15px;color:#fff;font-weight:950}.cash{background:var(--green)}.qr{background:#147fbe}
.toast{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#18394f;color:#fff;padding:11px 16px;border-radius:11px;font-weight:800;z-index:10}
@media(max-width:900px){.app{height:auto;min-height:100vh}.tabs{display:none}.stats{margin-left:auto}.stat{font-size:12px;padding:8px}.reset{font-size:12px;padding:8px}header{flex-wrap:wrap}.brand{min-width:auto}main{grid-template-columns:1fr}.cartpanel{border-left:0;border-top:1px solid var(--line);min-height:500px}.grid{grid-template-columns:repeat(2,1fr)}.mixgrid{grid-template-columns:repeat(2,1fr)}.pic{height:95px}}

.historyModal{display:none;position:fixed;inset:0;background:#0009;z-index:50;padding:24px}
.historyBox{max-width:900px;height:calc(100vh - 48px);margin:auto;background:#f5ead8;color:#302a25;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
.historyTop{background:linear-gradient(90deg,#17191b,#393027);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between}
.historyTop h2{margin:0}.closeHist{border:0;background:#fff2;color:#fff;font-size:24px;border-radius:9px;width:42px;height:42px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:#eadbc5}
.sum{background:#fff7eb;border-radius:12px;padding:10px;text-align:center}.sum b{display:block;font-size:20px;color:#a43b35}.sum small{font-weight:800;color:#766554}
.histList{overflow:auto;padding:12px;flex:1}.histItem{background:#fff8ed;border:1px solid #dac6aa;border-radius:13px;padding:12px;margin-bottom:9px}
.histRow{display:flex;justify-content:space-between;gap:10px}.histNo{font-weight:950;font-size:17px}.histPay{font-weight:900;color:#a43b35}.histItems{font-size:13px;color:#6f6153;margin-top:7px;line-height:1.45}.histTime{font-size:11px;color:#988777;margin-top:5px}
.histBottom{padding:11px 12px;border-top:1px solid #d4c2a8;display:flex;justify-content:flex-end}.clearHist{border:1px solid #dca7a7;background:#fff0f0;color:#b83d3d;border-radius:10px;padding:10px 13px;font-weight:900}
@media(max-width:650px){.historyModal{padding:8px}.historyBox{height:calc(100vh - 16px)}.summary{grid-template-columns:repeat(2,1fr)}}

/* V9 - safe iPad landscape refinement */
@media (min-width:901px) and (orientation:landscape){
  main{grid-template-columns:minmax(0,1fr) 420px!important}
  .cartpanel{min-width:0}
  .cart{overflow-y:auto}
  .qtybtn,.del{width:36px!important;height:34px!important;font-size:17px}
  .qtynum{min-width:26px!important;font-size:15px}
  .checkout{flex-shrink:0}
}

</style></head>
<body><div class="app">
<header>
<div class="brand">LAMAN 104<small>ICE BLENDED • SAME GREAT TASTE</small></div>
<div class="tabs"><button class="tab active">ICE BLENDED</button><button class="tab" disabled>COFFEE • AKAN DATANG</button></div>
<div class="stats"><div class="stat">Jualan <span id="sales">RM0</span></div><div class="stat">Order <span id="orders">0</span></div></div>
<button class="reset" style="color:#f0dfc4;background:#302820;border-color:#5b4b3d" onclick="openHistory()">History</button><button class="reset" onclick="resetAll()">Reset</button>
</header>
<main>
<section class="menu">
<div class="sectionhead"><h2>Original Flavours</h2><span class="pricepill">SEMUA RM3.00</span></div>
<div class="grid" id="normal"></div>
<div class="sectionhead" style="margin-top:14px"><h2>Mix Flavours</h2><span class="pricepill">RM3.00</span></div>
<div class="mixgrid" id="mix"></div>
</section>
<aside class="cartpanel">
<div class="orderhead"><div><b id="orderNo">Order #A001</b><br><small>Pesanan semasa</small></div><span>🥤</span></div>
<div class="cart" id="cart"></div>
<div class="checkout"><div class="tot"><span>JUMLAH</span><span class="amount" id="total">RM0.00</span></div>
<div class="payrow"><button class="pay cash" onclick="pay('CASH')">CASH</button><button class="pay qr" onclick="pay('QR PAY')">QR PAY</button></div></div>
</aside>
</main></div><div class="historyModal" id="historyModal"><div class="historyBox">
<div class="historyTop"><h2>Order History</h2><button class="closeHist" onclick="closeHistory()">×</button></div>
<div class="summary">
<div class="sum"><b id="hSales">RM0.00</b><small>Jumlah Jualan</small></div>
<div class="sum"><b id="hOrders">0</b><small>Order</small></div>
<div class="sum"><b id="hCash">RM0.00</b><small>Cash</small></div>
<div class="sum"><b id="hQR">RM0.00</b><small>QR Pay</small></div>
</div>
<div class="histList" id="histList"></div>
<div class="histBottom"><button class="clearHist" onclick="clearHistory()">Padam History</button></div>
</div></div><div class="toast" id="toast"></div>
<script>
const normal=[
["Strawberry Yogurt","straw","🍓"],["Mango Yogurt","mango","🥭"],["Chocolate Chip","chip","🍫"],["Chocolate","choc","🍫"],["Oreo","oreo","●"],
["Cappuccino","capp","☕"],["Hazelnut Coffee","hazel","🌰"],["Vanilla","van","✿"],["Blueberry","blue","🫐"],["White Coffee","whitec","☕"]];
const mixes=["Strawberry Chocolate","Strawberry Oreo","Oreo Chocolate","Vanilla Chocolate","Vanilla Mango","Vanilla Strawberry","Vanilla Blueberry"];
let cart=[],order=+(localStorage.getItem("l104order")||1),sales=+(localStorage.getItem("l104sales")||0),orders=+(localStorage.getItem("l104orders")||0),history=JSON.parse(localStorage.getItem("l104history")||"[]");
const rm=n=>"RM"+n.toFixed(2);
function draw(){
document.getElementById("normal").innerHTML=normal.map(x=>`<button class="card" onclick='add(${JSON.stringify(x[0])},"Original",3)'><div class="pic"><div class="cup ${x[1]}"><span>${x[2]}</span></div></div><div class="ct"><div class="name">${x[0]}</div><div class="price">RM3.00</div></div></button>`).join("");
document.getElementById("mix").innerHTML=mixes.map(x=>`<button class="mixcard" onclick='add(${JSON.stringify(x)},"Mix 2 Flavours",3)'><div class="mixname">🥤 ${x}</div><div class="mixprice">RM3.00</div></button>`).join(""); render();
}
function add(n,d,p){
let found=cart.find(x=>x.n===n && x.d===d && x.p===p);
if(found) found.q=(found.q||1)+1;
else cart.push({n,d,p,q:1});
render()
}
function changeQty(i,delta){
cart[i].q=(cart[i].q||1)+delta;
if(cart[i].q<=0) cart.splice(i,1);
render()
}
function del(i){cart.splice(i,1);render()}
function render(){
document.getElementById("orderNo").textContent="Order #A"+String(order).padStart(3,"0");
document.getElementById("cart").innerHTML=cart.length?cart.map((x,i)=>`<div class="line"><div><b>${x.n}</b><div class="desc">${x.d} • RM${x.p.toFixed(2)} / cup</div></div><div class="right">${rm(x.p*(x.q||1))}<div class="qtybox"><button class="qtybtn" onclick="changeQty(${i},-1)">−</button><span class="qtynum">${x.q||1}</span><button class="qtybtn" onclick="changeQty(${i},1)">+</button><button class="del" onclick="del(${i})">×</button></div></div></div>`).join(""):`<div class="empty">Tekan menu untuk mula order</div>`;
document.getElementById("total").textContent=rm(cart.reduce((a,x)=>a+x.p*(x.q||1),0));
document.getElementById("sales").textContent=rm(sales);
document.getElementById("orders").textContent=orders
}
function pay(method){
let t=cart.reduce((a,x)=>a+x.p*(x.q||1),0);if(!t)return note("Order masih kosong");
let no="A"+String(order).padStart(3,"0");
let qty=cart.reduce((a,x)=>a+(x.q||1),0);
history.unshift({no:no,method:method,total:t,items:cart.map(x=>({n:x.n,q:x.q||1,p:x.p})),qty:qty,time:new Date().toLocaleString("ms-MY")});
localStorage.setItem("l104history",JSON.stringify(history));
sales+=t;orders++;localStorage.setItem("l104sales",sales);localStorage.setItem("l104orders",orders);
note("Order #"+no+" • "+method+" • "+rm(t)+" ✓");order++;localStorage.setItem("l104order",order);cart=[];render()
}
function openHistory(){renderHistory();document.getElementById("historyModal").style.display="block"}
function closeHistory(){document.getElementById("historyModal").style.display="none"}
function renderHistory(){
let cash=history.filter(x=>x.method==="CASH").reduce((a,x)=>a+x.total,0);
let qr=history.filter(x=>x.method==="QR PAY").reduce((a,x)=>a+x.total,0);
document.getElementById("hSales").textContent=rm(history.reduce((a,x)=>a+x.total,0));
document.getElementById("hOrders").textContent=history.length;
document.getElementById("hCash").textContent=rm(cash);document.getElementById("hQR").textContent=rm(qr);
document.getElementById("histList").innerHTML=history.length?history.map(x=>`<div class="histItem"><div class="histRow"><span class="histNo">#${x.no} • ${x.qty} cup</span><span class="histPay">${x.method} • ${rm(x.total)}</span></div><div class="histItems">${x.items.map(i=>typeof i==="string"?i:((i.n||i.name||i.flavour||i.item||"Item")+" ×"+(i.q||i.qty||i.quantity||1))).join(" • ")}</div><div class="histTime">${x.time}</div></div>`).join(""):'<div class="empty">Belum ada rekod order.</div>'
}
function clearHistory(){if(confirm("Padam semua Order History?")){history=[];localStorage.setItem("l104history","[]");renderHistory();note("History dikosongkan")}}
function resetAll(){if(confirm("Reset jualan, bilangan order dan mula semula A001?")){sales=0;orders=0;order=1;cart=[];history=[];localStorage.setItem("l104history","[]");localStorage.setItem("l104sales",0);localStorage.setItem("l104orders",0);localStorage.setItem("l104order",1);render();note("Data ujian dikosongkan")}}
function note(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2200)}
draw();
</script></body></html>
